name: "Docker image: test"

# Verification only: it builds the Lyvune image for linux/amd64 and linux/arm64 and tests each one on its own
# architecture, without logging in to a registry and without pushing anything. Publishing the image is the job of
# release.yml, which is switched off (docs/RELEASING.md).
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - .env.example
      - scripts/smoke_test.py
      - scripts/docker-smoke-test.sh
      - cmd/healthcheck*.go
      - docs/DOCKER.md
      - .github/workflows/docker.yml
  push:
    branches:
      - master
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - .env.example
      - scripts/smoke_test.py
      - scripts/docker-smoke-test.sh
      - cmd/healthcheck*.go
      - docs/DOCKER.md
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Check the scripts
        run: |
          bash -n scripts/docker-smoke-test.sh
          python3 -m py_compile scripts/smoke_test.py
          shellcheck -x scripts/docker-smoke-test.sh

      # load: true keeps the image on the runner; nothing is pushed
      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: lyvune:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=dev
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Test the image
        run: scripts/docker-smoke-test.sh --image lyvune:smoke
