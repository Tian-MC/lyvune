name: "Docker image"

# Builds the Lyvune image for linux/amd64 and linux/arm64 and tests each one on its own architecture.
# It publishes to ghcr.io/tian-mc/lyvune only for a version tag (v*) or when asked to by hand, and
# only from the Tian-MC/lyvune repository. Nothing here creates a GitHub release.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - .env.example
      - scripts/smoke_test.py
      - scripts/docker-smoke-test.sh
      - cmd/healthcheck*.go
      - docs/DOCKER.md
      - .github/workflows/docker.yml
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Also publish the image to ghcr.io (as dev-<commit>, never as latest)"
        type: boolean
        default: false

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/tian-mc/lyvune

jobs:
  test:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Check the scripts
        run: |
          bash -n scripts/docker-smoke-test.sh
          python3 -m py_compile scripts/smoke_test.py
          shellcheck -x scripts/docker-smoke-test.sh

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: lyvune:smoke
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Test the image
        run: scripts/docker-smoke-test.sh --image lyvune:smoke

  publish:
    name: Publish to GHCR
    needs: test
    # A version tag, or a manual run that asks for it; never from a fork
    if: >-
      github.repository == 'Tian-MC/lyvune' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name, tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # Only a plain version (v1.2.3) is also the stable tags; v0.1.0-alpha and the like get their own tag only
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=sha,prefix=dev-,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Lyvune
            org.opencontainers.image.description=A self-hosted music server and streamer, with word-by-word karaoke lyrics
            org.opencontainers.image.licenses=GPL-3.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          provenance: true
          sbom: true
